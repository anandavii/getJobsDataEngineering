[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E/F/W = pycodestyle errors, pyflakes, warnings
# UP = pyupgrade (modernise syntax)
# B = flake8-bugbear (common bug patterns)
select = ["E", "F", "W", "UP", "B"]
# E402: module-level import not at top — expected in test files that patch sys.path
# E501: line too long — URLs and test HTML strings routinely exceed any fixed limit
ignore = ["E402", "E501"]
